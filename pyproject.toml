[project]
name = "finops-guardian"
version = "0.1.0"
description = "AI-powered Snowflake FinOps monitoring dashboard"
requires-python = ">=3.9"
dependencies = [
    # No upper bound needed: the app resolves st.rerun/st.experimental_rerun
    # and both query-param APIs at runtime, so it works either side of 1.37.
    "streamlit>=1.26.0",
    "snowflake-snowpark-python>=1.11.0",
    "snowflake-connector-python>=3.6.0",
    "pandas>=2.0.0",
    "altair>=5.0.0",
]
