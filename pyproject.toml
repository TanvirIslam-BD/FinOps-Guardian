[project]
name = "finops-guardian"
version = "0.1.0"
description = "AI-powered Snowflake FinOps monitoring dashboard"
requires-python = ">=3.9"
dependencies = [
    # Upper bound is deliberate: the app uses st.experimental_rerun and
    # st.experimental_get_query_params, both removed in Streamlit 1.37.
    "streamlit>=1.31.0,<1.37",
    "snowflake-snowpark-python>=1.11.0",
    "snowflake-connector-python>=3.6.0",
    "pandas>=2.0.0",
    "altair>=5.0.0",
]
